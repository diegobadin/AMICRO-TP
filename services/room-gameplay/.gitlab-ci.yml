# room-gameplay — event-sourced Uno engine, rooms and moves (P3).
# Change detection: every job is guarded by `rules: changes:` on this service's path so editing
# another service never runs these jobs (independent deployability).

# The engine's property and replay suites need nothing, but AC-P3.3 (a failed command leaves no
# events, no outbox rows and no consumed sequence) cannot be proved against a fake — so the job
# brings up an ephemeral Postgres and the store suite runs against that. Without TEST_DATABASE_URL
# the suite fails instead of skipping: a silently-skipped proof is worse than no proof.
"test:room-gameplay":
  stage: test
  image: gradle:8.8-jdk21
  services:
    - name: postgres:16-alpine
      alias: postgres
  variables:
    POSTGRES_USER: room_gameplay
    POSTGRES_PASSWORD: test
    POSTGRES_DB: room_gameplay
    TEST_DATABASE_URL: "jdbc:postgresql://postgres:5432/room_gameplay"
    TEST_DATABASE_USER: room_gameplay
    TEST_DATABASE_PASSWORD: test
  script:
    - cd services/room-gameplay
    - gradle --no-daemon test
    - gradle --no-daemon check
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - changes: ["services/room-gameplay/**/*", "ci/templates/**/*"]

"build:room-gameplay":
  extends: .build-image
  needs: ["test:room-gameplay"]
  variables:
    SVC: room-gameplay
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - changes: ["services/room-gameplay/**/*", "ci/templates/**/*"]

"deliver:room-gameplay":
  stage: deliver
  image:
    name: alpine/helm:3.20.2
    entrypoint: [""]
  needs: ["build:room-gameplay"]
  script:
    - helm lint services/room-gameplay/chart
    - helm package services/room-gameplay/chart -d /tmp
    - 'echo "delivered image $IMAGE_REF + chart"'
    # helm push /tmp/room-gameplay-*.tgz oci://$CI_REGISTRY/<group>/unoarena/charts  (when registry ready)
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - changes: ["services/room-gameplay/**/*", "ci/templates/**/*"]

# Fully wired since P3, on the same terms as identity: pinning the built digest into the staging
# overlay is what makes a from-empty cluster deployable, so it runs whether or not a persistent
# cluster is wired up. It runs on feature branches too, so a drill cluster tracking the branch
# deploys the branch's own image instead of whatever main last built.
# needs build:room-gameplay too, so the IMAGE/IMAGE_DIGEST dotenv is inherited.
"deploy-staging:room-gameplay":
  extends: .deploy-gitops
  stage: deploy-staging
  needs: ["deliver:room-gameplay", "build:room-gameplay"]
  variables:
    SVC: room-gameplay
    ENV: staging
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: on_success
    - changes: ["services/room-gameplay/**/*"]
      when: on_success
