# identity — the FULLY-WIRED service (test → build → deliver → deploy-staging →
# integration-staging → manual production gates).
# Change detection: every job is guarded by `rules: changes:` on this service's path so editing
# another service never runs these jobs (independent deployability).

"test:identity":
  stage: test
  image: node:20-alpine
  script:
    - cd services/identity
    - npm install --no-audit --no-fund
    - npm run lint
    - npm test
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - changes: ["services/identity/**/*", "ci/templates/**/*"]

"build:identity":
  extends: .build-image
  needs: ["test:identity"]
  variables:
    SVC: identity
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - changes: ["services/identity/**/*", "ci/templates/**/*"]

"deliver:identity":
  stage: deliver
  image:
    name: alpine/helm:3.20.2
    entrypoint: [""]
  needs: ["build:identity"]
  script:
    - helm lint services/identity/chart
    - helm package services/identity/chart -d /tmp
    - 'echo "delivered image $IMAGE_REF + chart"'
    # helm push /tmp/identity-*.tgz oci://$CI_REGISTRY/<group>/unoarena/charts  (when registry ready)
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - changes: ["services/identity/**/*", "ci/templates/**/*"]

# ── Phase 2 (fully-wired). Pinning the built digest into the staging overlay is what makes a
# from-empty cluster deployable, so it runs whether or not a persistent cluster is wired up; the
# push-based `argocd sync` half only happens when $ARGOCD_SERVER is set (see .deploy-gitops).
# It runs on feature branches too, so a drill cluster tracking the branch deploys the branch's own
# image instead of whatever main last built.
# needs build:identity too, so the IMAGE/IMAGE_DIGEST dotenv (from the build job) is inherited.
"deploy-staging:identity":
  extends: .deploy-gitops
  stage: deploy-staging
  needs: ["deliver:identity", "build:identity"]
  variables:
    SVC: identity
    ENV: staging
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: on_success
    - changes: ["services/identity/**/*"]
      when: on_success

# Self-contained GitOps green run (consigna §9): stands up kind + Argo CD inside the CI runner
# (dind), lets ARGO deploy identity from the repo (chart, image pinned to the digest CI built),
# waits for Argo Healthy+Synced (readiness gate), then drives the Client-CLI smoke. No external
# cluster, no cloud — entirely within GitLab. On an ephemeral CI cluster the deploy + smoke share
# one job (the cluster is job-scoped); the gitops/ Applications + deploy-staging:identity describe
# the same GitOps flow against a persistent cluster.
"integration-staging:identity":
  stage: integration-staging
  image: docker:27
  services:
    - docker:27-dind
  needs: ["build:identity", "deliver:identity"]
  variables:
    DOCKER_HOST: "tcp://docker:2376"
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_TLS_VERIFY: "1"
    DOCKER_CERT_PATH: "/certs/client"
    KUBECONFIG: "/tmp/kubeconfig"
    REPO_URL: "https://gitlab.com/itba-73-40-microservicios/alumnos/2026-s1/grupo-4/amicro-tp.git"
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  script:
    - apk add --no-cache curl bash git nodejs npm
    - 'curl -sSLo /usr/local/bin/kind https://kind.sigs.k8s.io/dl/v0.23.0/kind-linux-amd64 && chmod +x /usr/local/bin/kind'
    - 'curl -sSLo /usr/local/bin/kubectl https://dl.k8s.io/release/v1.30.0/bin/linux/amd64/kubectl && chmod +x /usr/local/bin/kubectl'
    - 'curl -sSLo /usr/local/bin/argocd https://github.com/argoproj/argo-cd/releases/download/v2.12.3/argocd-linux-amd64 && chmod +x /usr/local/bin/argocd'
    - 'until docker info >/dev/null 2>&1; do sleep 1; done'
    # 1) Pull the exact image CI built (by digest) and load it into kind
    - 'docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"'
    - 'docker pull "$IMAGE@$IMAGE_DIGEST"'
    - 'docker tag "$IMAGE@$IMAGE_DIGEST" ci-identity:smoke'
    # 2) kind cluster: publish the API server + NodePort on the dind host's IP so the job container
    #    can reach them (the `docker` dind service alias is in /etc/hosts).
    #    One awk over the file rather than `grep | awk | head -1`: the runner sets `pipefail`, so
    #    `head` closing the pipe early makes grep die of SIGPIPE and the line exits 141. It is a
    #    race on how much grep has written — which is why this passed for months and then did not.
    #    Matching the alias field exactly also beats `grep -w docker`, which matched docker.local too.
    - 'DIND_IP=$(awk "{ for (i = 2; i <= NF; i++) if (\$i == \"docker\") { print \$1; exit } }" /etc/hosts); echo "DIND_IP=$DIND_IP"'
    - |
      cat > /tmp/kind.yaml <<EOF
      kind: Cluster
      apiVersion: kind.x-k8s.io/v1alpha4
      networking:
        apiServerAddress: "$DIND_IP"
        apiServerPort: 6443
      nodes:
        - role: control-plane
          extraPortMappings:
            - containerPort: 30080
              hostPort: 30080
              listenAddress: "0.0.0.0"
      EOF
    - 'kind create cluster --name ci --config /tmp/kind.yaml --wait 150s'
    - 'kind get kubeconfig --name ci > "$KUBECONFIG"'
    - 'kubectl cluster-info'
    - 'kind load docker-image ci-identity:smoke --name ci'
    # 3) Install Argo CD and wait for its components
    - 'kubectl create namespace argocd'
    - 'kubectl apply -n argocd -f https://raw.githubusercontent.com/argoproj/argo-cd/v2.12.3/manifests/install.yaml'
    - 'kubectl -n argocd rollout status deploy/argocd-repo-server --timeout=300s'
    - 'kubectl -n argocd rollout status deploy/argocd-redis --timeout=180s'
    - 'kubectl -n argocd rollout status statefulset/argocd-application-controller --timeout=240s'
    # 4) Give Argo read access to the private repo via the CI job token, then create the Application
    - |
      cat <<EOF | kubectl apply -f -
      apiVersion: v1
      kind: Secret
      metadata:
        name: repo-amicro
        namespace: argocd
        labels:
          argocd.argoproj.io/secret-type: repository
      stringData:
        type: git
        url: $REPO_URL
        username: gitlab-ci-token
        password: $CI_JOB_TOKEN
      EOF
    # 4b) identity is a real service now: it needs a Postgres and a Redis. Two throwaway pods, not
    #     the operators — the operator path is what the from-empty cluster drills cover
    #     (specs/2026-08-08-p2-identity-auth), and this job's value is exercising the auth slice.
    - 'kubectl create namespace unoarena-staging'
    - |
      cat <<'EOF' | kubectl apply -n unoarena-staging -f -
      apiVersion: apps/v1
      kind: Deployment
      metadata: {name: postgres}
      spec:
        replicas: 1
        selector: {matchLabels: {app: postgres}}
        template:
          metadata: {labels: {app: postgres}}
          spec:
            containers:
              - name: postgres
                image: postgres:16-alpine
                # Ephemeral by design: the cluster dies with the job, so durability is dead weight.
                args: ["-c", "fsync=off", "-c", "full_page_writes=off"]
                env:
                  - {name: POSTGRES_USER, value: identity}
                  - {name: POSTGRES_PASSWORD, value: ci-smoke}
                  - {name: POSTGRES_DB, value: identity}
                ports: [{containerPort: 5432}]
      ---
      apiVersion: v1
      kind: Service
      metadata: {name: postgres}
      spec:
        selector: {app: postgres}
        ports: [{port: 5432, targetPort: 5432}]
      ---
      apiVersion: apps/v1
      kind: Deployment
      metadata: {name: redis}
      spec:
        replicas: 1
        selector: {matchLabels: {app: redis}}
        template:
          metadata: {labels: {app: redis}}
          spec:
            containers:
              - name: redis
                image: redis:7.4.10-alpine
                ports: [{containerPort: 6379}]
      ---
      apiVersion: v1
      kind: Service
      metadata: {name: redis}
      spec:
        selector: {app: redis}
        ports: [{port: 6379, targetPort: 6379}]
      EOF
    - 'kubectl -n unoarena-staging rollout status deploy/postgres --timeout=180s'
    - 'kubectl -n unoarena-staging rollout status deploy/redis --timeout=120s'
    - |
      cat <<EOF | kubectl apply -f -
      apiVersion: argoproj.io/v1alpha1
      kind: Application
      metadata:
        name: identity-staging
        namespace: argocd
      spec:
        project: default
        destination:
          server: https://kubernetes.default.svc
          namespace: unoarena-staging
        source:
          repoURL: $REPO_URL
          targetRevision: $CI_COMMIT_SHA
          path: services/identity/chart
          helm:
            # KAFKA_BROKERS deliberately points nowhere: this job doubles as the standing proof
            # that a missing broker degrades to a counted failure instead of breaking auth.
            values: |
              image: {repository: ci-identity, tag: smoke, digest: ""}
              service: {type: NodePort, nodePort: 30080}
              secretName: ""
              serviceMonitor: {enabled: false}
              env:
                - {name: DATABASE_HOST, value: postgres}
                - {name: DATABASE_USER, value: identity}
                - {name: DATABASE_NAME, value: identity}
                - {name: IDENTITY_DB_PASSWORD, value: ci-smoke}
                - {name: IDENTITY_JWT_SECRET, value: ci-smoke-secret}
                - {name: REDIS_URL, value: "redis://redis:6379"}
                - {name: KAFKA_BROKERS, value: "no-broker-here:9092"}
        syncPolicy:
          syncOptions:
            - CreateNamespace=true
      EOF
    # 5) GitOps deploy via Argo + readiness gate (wait for Healthy+Synced).
    #    --core reads argocd-cm from the current kube-context namespace, so point it at argocd.
    - 'kubectl config set-context --current --namespace=argocd'
    - 'argocd app sync identity-staging --core --timeout 240'
    - 'argocd app wait identity-staging --core --health --sync --timeout 240'
    - 'kubectl -n unoarena-staging rollout status deploy/identity --timeout=120s'
    # 6) Client-CLI smoke against the NodePort. The whole auth slice, driven through the same
    #    command surface the faculty uses: register, whoami, a second login that must kill the
    #    first session, logout, and seed. The 401s are expected, so they do not fail the shell —
    #    assert-smoke.js is what decides whether the run was correct.
    - 'cd clients/cli && npm ci && npm run build && cd "$CI_PROJECT_DIR"'
    - 'export UNOARENA_API_URL=http://docker:30080 OUT=/tmp/smoke && mkdir -p $OUT'
    - 'U="smoke-$CI_PIPELINE_ID"'
    - 'UNOARENA_SESSION=/tmp/s1.json node clients/cli/dist/cli.js register --user "$U" --pass pw --json | tee $OUT/register.json'
    - 'UNOARENA_SESSION=/tmp/s1.json node clients/cli/dist/cli.js whoami --json | tee $OUT/whoami.json'
    - 'UNOARENA_SESSION=/tmp/s2.json node clients/cli/dist/cli.js login --user "$U" --pass pw --json | tee $OUT/relogin.json'
    - 'UNOARENA_SESSION=/tmp/s1.json node clients/cli/dist/cli.js whoami --json > $OUT/stale.json || true'
    - 'UNOARENA_SESSION=/tmp/s2.json node clients/cli/dist/cli.js logout --json | tee $OUT/logout.json'
    - 'UNOARENA_SESSION=/tmp/s2.json node clients/cli/dist/cli.js whoami --json > $OUT/after-logout.json || true'
    - 'node clients/cli/dist/cli.js seed --count 3 --prefix "seed-$CI_PIPELINE_ID" --json | tee $OUT/seed.json'
    - 'node clients/cli/dist/cli.js seed --count 3 --prefix "seed-$CI_PIPELINE_ID" --json | tee $OUT/reseed.json'
    - 'node clients/cli/scripts/assert-smoke.js $OUT "$U"'
    # 7) Observability hook (consigna §6.8): the structured JSON log line the smoke just caused,
    #    retrieved the way an operator would.
    - 'kubectl -n unoarena-staging logs deploy/identity --tail=5'
  after_script:
    - 'kind delete cluster --name ci || true'

# ── Phase 3 (optional, consigna §6.7): production behind manual gates on the default branch.
# deliver-production promotes the digest this pipeline's staging smoke just validated (same
# build:identity dotenv — build once, never a rebuild). deploy-production reconciles
# identity-production and, like deploy-staging, only appears once the persistent cluster is wired
# via $ARGOCD_SERVER. allow_failure keeps an unclicked gate from blocking the green pipeline.
"deliver-production:identity":
  extends: .promote-digest
  stage: deliver-production
  needs: ["integration-staging:identity", "build:identity"]
  variables:
    SVC: identity
    ENV: production
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
      allow_failure: true

"deploy-production:identity":
  extends: .argocd-sync
  stage: deploy-production
  needs: ["deliver-production:identity"]
  variables:
    SVC: identity
    ENV: production
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $ARGOCD_SERVER'
      when: manual
      allow_failure: true
