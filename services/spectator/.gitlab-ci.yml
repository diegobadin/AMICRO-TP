# spectator — the privacy-filtered Kafka projection and its SSE fan-out (P6). Fully wired since
# this phase, and a declared consumer of the GameCompleted contract.
# Change detection: every job is guarded by `rules: changes:` on this service's path so editing
# another service never runs these jobs (independent deployability).

"test:spectator":
  stage: test
  image: node:20-alpine
  # The dedup IS `SADD`'s return value and the TTL IS a Redis behaviour, so the store suite runs
  # against a real one. Without TEST_REDIS_URL it fails instead of skipping: a silently-skipped
  # proof is worse than no proof.
  services:
    - name: redis:7.4.10-alpine
      alias: redis
  variables:
    TEST_REDIS_URL: "redis://redis:6379"
  script:
    - cd services/spectator
    - npm install --no-audit --no-fund
    - npm run lint
    - npm test
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - changes: ["services/spectator/**/*", "ci/templates/**/*", "ci/contracts/**/*"]

"build:spectator":
  extends: .build-image
  # Same shape as the other two consumers: optional because the check only enters the pipeline when
  # the schema or one of the paired services changes, and a `needs:` on an absent job is a config
  # error. When it IS present it gates.
  needs:
    - "test:spectator"
    - job: "test:contract:game-completed"
      optional: true
  variables:
    SVC: spectator
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - changes: ["services/spectator/**/*", "ci/templates/**/*", "ci/contracts/**/*"]

"deliver:spectator":
  stage: deliver
  image:
    name: alpine/helm:3.20.2
    entrypoint: [""]
  needs: ["build:spectator"]
  script:
    - helm lint services/spectator/chart
    - helm package services/spectator/chart -d /tmp
    - 'echo "delivered image $IMAGE_REF + chart"'
    # helm push /tmp/spectator-*.tgz oci://$CI_REGISTRY/<group>/unoarena/charts  (when registry ready)
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - changes: ["services/spectator/**/*", "ci/templates/**/*", "ci/contracts/**/*"]

# A real gate since P6: it pins the digest into the staging overlay and waits for Argo to report the
# app healthy, exactly as the other wired services do. `needs` includes build:spectator for its dotenv
# ($IMAGE, $IMAGE_DIGEST) — deliver alone does not carry them, and without it the pin writes empty
# strings into the overlay and the job still goes green.
"deploy-staging:spectator":
  extends: .deploy-gitops
  stage: deploy-staging
  needs: ["deliver:spectator", "build:spectator"]
  variables:
    SVC: spectator
    ENV: staging
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - changes: ["services/spectator/**/*", "ci/templates/**/*", "ci/contracts/**/*"]
