# Default (base) values. Environment overlays in gitops/apps/spectator/overlays/<env>/values.yaml
# override replicas, logLevel, URLs, and pin image.digest. Secrets are NOT here — they come from a
# SealedSecret mounted as env (see gitops overlay). The image is pinned by digest at deploy time.
image:
  repository: registry.gitlab.com/itba-73-40-microservicios/alumnos/2026-s1/grupo-4/amicro-tp/unoarena/spectator
  digest: "" # pinned by CI/GitOps (build once, promote by digest)
  tag: latest # fallback only; digest wins when set
  pullPolicy: IfNotPresent

# One replica, for two independent reasons — see src/broker.ts. The fan-out is in-process, so a
# second replica would serve spectators the partitions it does not consume; and projecting is a
# read-modify-write on one Redis key while a room's log arrives on two topics, whose partitions
# are assigned independently. Both would have to be solved, not just the first.
replicas: 1
port: 8086
healthPath: /health
logLevel: info

imagePullSecrets: []

serviceMonitor:
  enabled: false
  interval: 30s

env: []

# Sized from usage measured under load on the kind cluster (P9): peak 66 MiB / 29m. Memory limit
# only — a CPU limit throttles exactly when a demo bursts, and the limit is what lets the
# golden-signals board express saturation as a percentage rather than absolute bytes.
resources:
  requests:
    cpu: 50m
    memory: 96Mi
  limits:
    memory: 256Mi
