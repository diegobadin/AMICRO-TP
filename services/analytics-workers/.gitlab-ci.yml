# analytics-workers — placeholder fragment (test → build → deliver → deploy-staging stub; NOT
# fully-wired). Change detection: every job is guarded by `rules: changes:` on this service's path
# so editing another service never runs these jobs (independent deployability).
#
# Cross-service contract: build also needs the async GameCompleted contract check (this worker is a
# consumer), so an incompatible event-schema change blocks this build (fail-fast, consigna §6.3).

"test:analytics-workers":
  stage: test
  image: python:3.12-slim
  # "a replay does not double-count" is a property of the transaction, not of any branch — a fake
  # would only test the fake. Without TEST_DATABASE_URL the suite fails rather than skips.
  services:
    - name: postgres:16-alpine
      alias: postgres
  variables:
    POSTGRES_USER: analytics
    POSTGRES_PASSWORD: test
    POSTGRES_DB: analytics
    TEST_DATABASE_URL: "postgresql://analytics:test@postgres:5432/analytics"
  script:
    - cd services/analytics-workers
    - pip install --quiet -r requirements.txt ruff mypy pytest
    - ruff check .
    - mypy .
    - pytest
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - changes: ["services/analytics-workers/**/*", "ci/templates/**/*", "ci/contracts/**/*"]

"build:analytics-workers":
  extends: .build-image
  # optional: the contract check only enters the pipeline when the schema or one of the paired
  # services changes. Editing a shared CI template pulls this build in without it, and a `needs`
  # on an absent job is a pipeline config error. When the check IS present it still gates.
  needs:
    - "test:analytics-workers"
    - job: "test:contract:game-completed"
      optional: true
  variables:
    SVC: analytics-workers
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - changes: ["services/analytics-workers/**/*", "ci/templates/**/*", "ci/contracts/**/*"]

"deliver:analytics-workers":
  stage: deliver
  image:
    name: alpine/helm:3.20.2
    entrypoint: [""]
  needs: ["build:analytics-workers"]
  script:
    - helm lint services/analytics-workers/chart
    - helm package services/analytics-workers/chart -d /tmp
    - 'echo "delivered image $IMAGE_REF + chart"'
    # helm push /tmp/analytics-workers-*.tgz oci://$CI_REGISTRY/<group>/unoarena/charts  (when ready)
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - changes: ["services/analytics-workers/**/*", "ci/templates/**/*", "ci/contracts/**/*"]

# A real gate since P6. `needs` includes build:analytics-workers for its dotenv ($IMAGE,
# $IMAGE_DIGEST) — deliver alone does not carry them, and without it the pin writes empty strings
# into the overlay and the job still goes green.
"deploy-staging:analytics-workers":
  extends: .deploy-gitops
  stage: deploy-staging
  needs: ["deliver:analytics-workers", "build:analytics-workers"]
  variables:
    SVC: analytics-workers
    ENV: staging
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - changes: ["services/analytics-workers/**/*", "ci/templates/**/*", "ci/contracts/**/*"]
