# Default (base) values. Environment overlays in gitops/apps/analytics-workers/overlays/<env>/values.yaml
# override replicas, logLevel, URLs, and pin image.digest. Secrets are NOT here — they come from a
# SealedSecret mounted as env (see gitops overlay). The image is pinned by digest at deploy time.
image:
  repository: registry.gitlab.com/itba-73-40-microservicios/alumnos/2026-s1/grupo-4/amicro-tp/unoarena/analytics-workers
  digest: "" # pinned by CI/GitOps (build once, promote by digest)
  tag: latest # fallback only; digest wins when set
  pullPolicy: IfNotPresent

# One replica because nothing needs a second, NOT because a second would break. Unlike ranking and
# spectator, every write here is an atomic upsert — `value = value + excluded.value`, `greatest(...)`,
# `on conflict do nothing` — so concurrent consumers in this group would stay correct. The asymmetry
# is deliberate: Elo has to read a rating before it can compute a delta, and this does not.
replicas: 1
port: 8090
healthPath: /health
logLevel: info

imagePullSecrets: []
secretName: "" # analytics-secrets: its own database password, and nothing else

serviceMonitor:
  enabled: false
  interval: 30s

env: []

# Sized from usage measured under load on the kind cluster (P9): peak 35 MiB / 3m. Memory limit
# only — a CPU limit throttles exactly when a demo bursts, and the limit is what lets the
# golden-signals board express saturation as a percentage rather than absolute bytes.
resources:
  requests:
    cpu: 25m
    memory: 64Mi
  limits:
    memory: 192Mi
