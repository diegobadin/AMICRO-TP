# Default (base) values. Environment overlays in gitops/apps/tournament/overlays/<env>/values.yaml
# override replicas, logLevel, URLs, and pin image.digest. Secrets are NOT here — they come from a
# SealedSecret mounted as env (see gitops overlay). The image is pinned by digest at deploy time.
image:
  repository: registry.gitlab.com/itba-73-40-microservicios/alumnos/2026-s1/grupo-4/amicro-tp/unoarena/tournament
  digest: "" # pinned by CI/GitOps (build once, promote by digest)
  tag: latest # fallback only; digest wins when set
  pullPolicy: IfNotPresent

replicas: 1
port: 8083
healthPath: /health
logLevel: info

imagePullSecrets: []
secretName: "" # tournament-secrets: its database password and the internal token

serviceMonitor:
  enabled: false
  interval: 30s

env: []

# Sized from usage measured under load on the kind cluster (P9): peak 219 MiB / 23m. Memory limit
# only — a CPU limit throttles exactly when a demo bursts, and the limit is what lets the
# golden-signals board express saturation as a percentage rather than absolute bytes.
# The JVM reads this limit: see JAVA_TOOL_OPTIONS in the deployment template, which stops the
# default 25%-of-limit heap from landing below what this service was measured using.
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 640Mi
