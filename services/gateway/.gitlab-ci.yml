# gateway — the single entry point and the SSE tier (P4). Change detection: every job is guarded by
# `rules: changes:` on this service's path so editing another service never runs these jobs
# (independent deployability).

"test:gateway":
  stage: test
  image: node:20-alpine
  script:
    - cd services/gateway
    - npm install --no-audit --no-fund
    - npm run lint
    - npm test
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - changes: ["services/gateway/**/*", "ci/templates/**/*"]

"build:gateway":
  extends: .build-image
  needs: ["test:gateway"]
  variables:
    SVC: gateway
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - changes: ["services/gateway/**/*", "ci/templates/**/*"]

"deliver:gateway":
  stage: deliver
  image:
    name: alpine/helm:3.20.2
    entrypoint: [""]
  needs: ["build:gateway"]
  script:
    - helm lint services/gateway/chart
    - helm package services/gateway/chart -d /tmp
    - 'echo "delivered image $IMAGE_REF + chart"'
    # helm push /tmp/gateway-*.tgz oci://$CI_REGISTRY/<group>/unoarena/charts  (when registry ready)
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - changes: ["services/gateway/**/*", "ci/templates/**/*"]

# Real GitOps deploy now, like identity's and room-gameplay's: pin the delivered digest into the
# staging overlay and let Argo reconcile. `needs` includes build:gateway for its dotenv ($IMAGE,
# $IMAGE_DIGEST) — deliver alone does not carry them.
"deploy-staging:gateway":
  extends: .deploy-gitops
  stage: deploy-staging
  needs: ["deliver:gateway", "build:gateway"]
  variables:
    SVC: gateway
    ENV: staging
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: on_success
    - changes: ["services/gateway/**/*"]
      when: on_success
