# Default (base) values. Environment overlays in gitops/apps/gateway/overlays/<env>/values.yaml
# override replicas, logLevel, URLs, and pin image.digest. Secrets are NOT here — they come from a
# SealedSecret mounted as env (see gitops overlay). The image is pinned by digest at deploy time.
image:
  repository: registry.gitlab.com/itba-73-40-microservicios/alumnos/2026-s1/grupo-4/amicro-tp/unoarena/gateway
  digest: "" # pinned by CI/GitOps (build once, promote by digest)
  tag: latest # fallback only; digest wins when set
  pullPolicy: IfNotPresent

# The project registry is private: without a pull secret every pod on a fresh cluster sits in
# ImagePullBackOff. Delivered as a SealedSecret by the secrets-<env> app (gitops/secrets/).
imagePullSecrets: []

replicas: 1
port: 8080
healthPath: /health
logLevel: info

# Service exposure. The staging overlay takes over identity's NodePort 30080 when the gateway
# becomes the single entry point; until then it stays ClusterIP and reaches nobody.
service:
  type: ClusterIP
  nodePort: ""

# Prometheus scraping of /metrics. Off by default so the chart still renders on a cluster without
# the kube-prometheus CRDs; the environment overlays turn it on.
serviceMonitor:
  enabled: false
  interval: 30s

# Optional: name of a Secret (delivered as a SealedSecret via GitOps) injected as env. Empty = none.
secretName: ""

env: []

# Sized from usage measured under load on the kind cluster (P9): peak 48 MiB / 8m. Memory limit
# only — a CPU limit throttles exactly when a demo bursts, and the limit is what lets the
# golden-signals board express saturation as a percentage rather than absolute bytes.
resources:
  requests:
    cpu: 50m
    memory: 96Mi
  limits:
    memory: 256Mi
