# outbox-relay — the transactional outbox's second half (P5): drains committed rows to Kafka.
# Fully-wired since P5; deploy-staging is a real GitOps deploy.
# Change detection: every job is guarded by `rules: changes:` on this service's path so editing
# another service never runs these jobs (independent deployability).

"test:outbox-relay":
  stage: test
  image: golang:1.22-alpine
  script:
    - cd services/outbox-relay
    - go vet ./...
    - go test ./...
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - changes: ["services/outbox-relay/**/*", "ci/templates/**/*"]

"build:outbox-relay":
  extends: .build-image
  needs: ["test:outbox-relay"]
  variables:
    SVC: outbox-relay
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - changes: ["services/outbox-relay/**/*", "ci/templates/**/*"]

"deliver:outbox-relay":
  stage: deliver
  image:
    name: alpine/helm:3.20.2
    entrypoint: [""]
  needs: ["build:outbox-relay"]
  script:
    - helm lint services/outbox-relay/chart
    - helm package services/outbox-relay/chart -d /tmp
    - 'echo "delivered image $IMAGE_REF + chart"'
    # helm push /tmp/outbox-relay-*.tgz oci://$CI_REGISTRY/<group>/unoarena/charts  (when registry ready)
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - changes: ["services/outbox-relay/**/*", "ci/templates/**/*"]

# Real GitOps deploy since P5, like gateway's and room-gameplay's: pin the delivered digest into
# the staging overlay and let Argo reconcile. `needs` includes build:outbox-relay for its dotenv
# ($IMAGE, $IMAGE_DIGEST) — deliver alone does not carry them.
"deploy-staging:outbox-relay":
  extends: .deploy-gitops
  stage: deploy-staging
  needs: ["deliver:outbox-relay", "build:outbox-relay"]
  variables:
    SVC: outbox-relay
    ENV: staging
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: on_success
    - changes: ["services/outbox-relay/**/*"]
      when: on_success
