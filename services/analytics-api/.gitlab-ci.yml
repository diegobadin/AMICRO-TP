# analytics-api — placeholder fragment (test → build → deliver → deploy-staging stub; NOT
# fully-wired). Change detection: every job is guarded by `rules: changes:` on this service's path
# so editing another service never runs these jobs (independent deployability).
# analytics-api is not a GameCompleted consumer, so build needs only its own test.

"test:analytics-api":
  stage: test
  image: python:3.12-slim
  # The query suite runs against the WRITER's own schema, imported off the checkout — that is the
  # CQRS seam, and it is why this job also runs when analytics-workers changes: a column renamed
  # there must turn this service red rather than surface as a 503 in staging.
  services:
    - name: postgres:16-alpine
      alias: postgres
  variables:
    POSTGRES_USER: analytics
    POSTGRES_PASSWORD: test
    POSTGRES_DB: analytics
    TEST_DATABASE_URL: "postgresql://analytics:test@postgres:5432/analytics"
  script:
    - cd services/analytics-api
    - pip install --quiet -r requirements.txt ruff mypy pytest
    - ruff check .
    - mypy .
    - pytest
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - changes:
        - services/analytics-api/**/*
        - services/analytics-workers/**/* # the schema this service reads
        - ci/templates/**/*

"build:analytics-api":
  extends: .build-image
  needs: ["test:analytics-api"]
  variables:
    SVC: analytics-api
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - changes: ["services/analytics-api/**/*", "ci/templates/**/*"]

"deliver:analytics-api":
  stage: deliver
  image:
    name: alpine/helm:3.20.2
    entrypoint: [""]
  needs: ["build:analytics-api"]
  script:
    - helm lint services/analytics-api/chart
    - helm package services/analytics-api/chart -d /tmp
    - 'echo "delivered image $IMAGE_REF + chart"'
    # helm push /tmp/analytics-api-*.tgz oci://$CI_REGISTRY/<group>/unoarena/charts  (when ready)
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - changes: ["services/analytics-api/**/*", "ci/templates/**/*"]

# A real gate since P6. `needs` includes build:analytics-api for its dotenv ($IMAGE, $IMAGE_DIGEST)
# — deliver alone does not carry them, and without it the pin writes empty strings into the overlay
# and the job still goes green.
"deploy-staging:analytics-api":
  extends: .deploy-gitops
  stage: deploy-staging
  needs: ["deliver:analytics-api", "build:analytics-api"]
  variables:
    SVC: analytics-api
    ENV: staging
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - changes: ["services/analytics-api/**/*", "ci/templates/**/*"]
