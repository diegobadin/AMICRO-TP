[project]
name = "unoarena-analytics-api"
version = "0.2.0"
description = "UnoArena analytics query API — read-only over the analytics projections"
requires-python = ">=3.12"
dependencies = [
  "psycopg[binary]==3.2.3",
  "prometheus-client==0.21.1",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "mypy"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "S", "A", "UP"]
# UP017 (datetime.UTC) requires py3.11+ at runtime; keep timezone.utc for broad runtime compat.
ignore = ["UP017"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
# tests/test_queries.py imports the WRITER's schema off the checkout — that import is the CQRS seam
# and is deliberately not in the runtime image, so mypy needs to be pointed at it explicitly.
mypy_path = ["../analytics-workers"]
files = ["app.py", "server.py", "reader.py", "queries.py", "metrics.py", "tests"]

[tool.pytest.ini_options]
pythonpath = ["."]
