# Default (base) values. Environment overlays in gitops/apps/analytics-api/overlays/<env>/values.yaml
# override replicas, logLevel, URLs, and pin image.digest. Secrets are NOT here — they come from a
# SealedSecret mounted as env (see gitops overlay). The image is pinned by digest at deploy time.
image:
  repository: registry.gitlab.com/itba-73-40-microservicios/alumnos/2026-s1/grupo-4/amicro-tp/unoarena/analytics-api
  digest: "" # pinned by CI/GitOps (build once, promote by digest)
  tag: latest # fallback only; digest wins when set
  pullPolicy: IfNotPresent

replicas: 1
port: 8087
healthPath: /health
logLevel: info

imagePullSecrets: []
secretName: "" # analytics-secrets: its own database password, and nothing else

serviceMonitor:
  enabled: false
  interval: 30s

env: []

# Sized from usage measured under load on the kind cluster (P9): peak 28 MiB / 2m. Memory limit
# only — a CPU limit throttles exactly when a demo bursts, and the limit is what lets the
# golden-signals board express saturation as a percentage rather than absolute bytes.
resources:
  requests:
    cpu: 25m
    memory: 64Mi
  limits:
    memory: 192Mi
