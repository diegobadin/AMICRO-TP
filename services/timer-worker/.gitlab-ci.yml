# timer-worker — the durable-deadline clock (P5): finds overdue rooms and ticks room-gameplay.
# Fully-wired since P5; deploy-staging is a real GitOps deploy.
# Change detection: every job is guarded by `rules: changes:` on this service's path so editing
# another service never runs these jobs (independent deployability).

"test:timer-worker":
  stage: test
  image: golang:1.22-alpine
  script:
    - cd services/timer-worker
    - go vet ./...
    - go test ./...
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - changes: ["services/timer-worker/**/*", "ci/templates/**/*"]

"build:timer-worker":
  extends: .build-image
  needs: ["test:timer-worker"]
  variables:
    SVC: timer-worker
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - changes: ["services/timer-worker/**/*", "ci/templates/**/*"]

"deliver:timer-worker":
  stage: deliver
  image:
    name: alpine/helm:3.20.2
    entrypoint: [""]
  needs: ["build:timer-worker"]
  script:
    - helm lint services/timer-worker/chart
    - helm package services/timer-worker/chart -d /tmp
    - 'echo "delivered image $IMAGE_REF + chart"'
    # helm push /tmp/timer-worker-*.tgz oci://$CI_REGISTRY/<group>/unoarena/charts  (when registry ready)
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - changes: ["services/timer-worker/**/*", "ci/templates/**/*"]

# Real GitOps deploy since P5, like gateway's and room-gameplay's: pin the delivered digest into
# the staging overlay and let Argo reconcile. `needs` includes build:timer-worker for its dotenv
# ($IMAGE, $IMAGE_DIGEST) — deliver alone does not carry them.
"deploy-staging:timer-worker":
  extends: .deploy-gitops
  stage: deploy-staging
  needs: ["deliver:timer-worker", "build:timer-worker"]
  variables:
    SVC: timer-worker
    ENV: staging
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: on_success
    - changes: ["services/timer-worker/**/*"]
      when: on_success
