# Default (base) values. Environment overlays in gitops/apps/timer-worker/overlays/<env>/values.yaml
# override replicas, logLevel, URLs, and pin image.digest. Secrets are NOT here — they come from a
# SealedSecret mounted as env (see gitops overlay). The image is pinned by digest at deploy time.
image:
  repository: registry.gitlab.com/itba-73-40-microservicios/alumnos/2026-s1/grupo-4/amicro-tp/unoarena/timer-worker
  digest: "" # pinned by CI/GitOps (build once, promote by digest)
  tag: latest # fallback only; digest wins when set
  pullPolicy: IfNotPresent

# One replica, deliberately. A missed tick is a latency problem and never a correctness one — the
# aggregate settles overdue deadlines on the next command regardless — so leader election would buy
# promptness during a restart and nothing else. Documented in the phase's ESTADO-FINAL rather than built.
replicas: 1
port: 8089
healthPath: /health
logLevel: info

imagePullSecrets: []
# The database password comes from room-gameplay's own SealedSecret: same bounded context, same
# login role, so nothing new had to be sealed for this service.
secretName: ""

serviceMonitor:
  enabled: false
  interval: 30s

env: []
