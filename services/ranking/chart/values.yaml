# Default (base) values. Environment overlays in gitops/apps/ranking/overlays/<env>/values.yaml
# override replicas, logLevel, URLs, and pin image.digest. Secrets are NOT here — they come from a
# SealedSecret mounted as env (see gitops overlay). The image is pinned by digest at deploy time.
image:
  repository: registry.gitlab.com/itba-73-40-microservicios/alumnos/2026-s1/grupo-4/amicro-tp/unoarena/ranking
  digest: "" # pinned by CI/GitOps (build once, promote by digest)
  tag: latest # fallback only; digest wins when set
  pullPolicy: IfNotPresent

# One replica, but no longer because a second would be wrong. Until P7 applying a rating was a
# read-modify-write that two consumers could interleave, so two replicas lost updates; `_lock_ratings`
# now creates any missing row and takes `for update` on every player of the batch in player-id order,
# which is what makes the write safe and the lock order deadlock-free. What is left is ordinary
# capacity: one replica keeps up with this system easily, and a second would buy a rebalance to
# reason about and nothing else. Raising it is now a decision about throughput, not a data-loss bug.
replicas: 1
port: 8084
healthPath: /health
logLevel: info

imagePullSecrets: []
secretName: "" # ranking-secrets: its own database password, and nothing else

serviceMonitor:
  enabled: false
  interval: 30s

env: []

# Sized from usage measured under load on the kind cluster (P9): peak 41 MiB / 3m. Memory limit
# only — a CPU limit throttles exactly when a demo bursts, and the limit is what lets the
# golden-signals board express saturation as a percentage rather than absolute bytes.
resources:
  requests:
    cpu: 25m
    memory: 64Mi
  limits:
    memory: 192Mi
