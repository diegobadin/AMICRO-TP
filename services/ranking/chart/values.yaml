# Default (base) values. Environment overlays in gitops/apps/ranking/overlays/<env>/values.yaml
# override replicas, logLevel, URLs, and pin image.digest. Secrets are NOT here — they come from a
# SealedSecret mounted as env (see gitops overlay). The image is pinned by digest at deploy time.
image:
  repository: registry.gitlab.com/itba-73-40-microservicios/alumnos/2026-s1/grupo-4/amicro-tp/unoarena/ranking
  digest: "" # pinned by CI/GitOps (build once, promote by digest)
  tag: latest # fallback only; digest wins when set
  pullPolicy: IfNotPresent

# One replica, and NOT merely because a second buys nothing. Applying Elo is a read-modify-write:
# `consume_game_completed` reads each player's current rating and writes the new one inside one
# transaction, which at READ COMMITTED does not stop a second consumer reading the same rating
# before either commits. Two replicas would lose updates on any player who finishes two games at
# once. Scaling this needs `select ... for update` plus a real row for every player (a new player
# has none to lock), which is a change, not a knob — do not raise this number expecting it to work.
replicas: 1
port: 8084
healthPath: /health
logLevel: info

imagePullSecrets: []
secretName: "" # ranking-secrets: its own database password, and nothing else

serviceMonitor:
  enabled: false
  interval: 30s

env: []
