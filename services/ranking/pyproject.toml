[project]
name = "unoarena-ranking"
version = "0.2.0"
description = "UnoArena ranking service — Elo consumer and rating reads"
requires-python = ">=3.12"
dependencies = [
  "confluent-kafka==2.6.1",
  "psycopg[binary]==3.2.3",
  "prometheus-client==0.21.1",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "mypy"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "S", "A", "UP"]
# UP017 (datetime.UTC) requires py3.11+ at runtime; keep timezone.utc for broad runtime compat.
ignore = ["UP017"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app.py", "server.py", "consumer.py", "store.py", "schema.py", "elo.py", "metrics.py", "tests"]

# confluent-kafka ships no type stubs. The seam is narrow — a Consumer and a Message — and both are
# behind `Any` parameters in consumer.py so the rules themselves stay typed.
[[tool.mypy.overrides]]
module = ["confluent_kafka.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["."]
