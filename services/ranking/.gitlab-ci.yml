# ranking — Elo consumer and rating reads (P6). Fully wired since this phase.
# Change detection: every job is guarded by `rules: changes:` on this service's path so editing
# another service never runs these jobs (independent deployability).
#
# Cross-service contract: build also needs the async GameCompleted contract check (ranking is a
# consumer), so an incompatible event-schema change blocks this build (fail-fast, consigna §6.3).
#
# The store suite proves idempotency, and `insert ... on conflict do nothing` inside a transaction
# IS the mechanism — a fake would only test the fake. So the job brings up an ephemeral Postgres and
# runs against it. Without TEST_DATABASE_URL those tests fail rather than skip: a silently-skipped
# proof is worse than no proof.

"test:ranking":
  stage: test
  image: python:3.12-slim
  services:
    - name: postgres:16-alpine
      alias: postgres
  variables:
    POSTGRES_USER: ranking
    POSTGRES_PASSWORD: test
    POSTGRES_DB: ranking
    TEST_DATABASE_URL: "postgresql://ranking:test@postgres:5432/ranking"
  script:
    - cd services/ranking
    - pip install --quiet -r requirements.txt ruff mypy pytest
    - ruff check .
    - mypy .
    - pytest
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - changes: ["services/ranking/**/*", "ci/templates/**/*", "ci/contracts/**/*"]

"build:ranking":
  extends: .build-image
  # optional: the contract check only enters the pipeline when the schema or one of the paired
  # services changes. Editing a shared CI template pulls this build in without it, and a `needs`
  # on an absent job is a pipeline config error. When the check IS present it still gates.
  needs:
    - "test:ranking"
    - job: "test:contract:game-completed"
      optional: true
  variables:
    SVC: ranking
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - changes: ["services/ranking/**/*", "ci/templates/**/*", "ci/contracts/**/*"]

"deliver:ranking":
  stage: deliver
  image:
    name: alpine/helm:3.20.2
    entrypoint: [""]
  needs: ["build:ranking"]
  script:
    - helm lint services/ranking/chart
    - helm package services/ranking/chart -d /tmp
    - 'echo "delivered image $IMAGE_REF + chart"'
    # helm push /tmp/ranking-*.tgz oci://$CI_REGISTRY/<group>/unoarena/charts  (when registry ready)
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - changes: ["services/ranking/**/*", "ci/templates/**/*", "ci/contracts/**/*"]

# A real gate since P6: it pins the digest into the staging overlay and waits for Argo to report the
# app healthy, exactly as the other wired services do. `needs` includes build:ranking for its dotenv
# ($IMAGE, $IMAGE_DIGEST) — deliver alone does not carry them, and without it the pin writes empty
# strings into the overlay and the job still goes green.
"deploy-staging:ranking":
  extends: .deploy-gitops
  stage: deploy-staging
  needs: ["deliver:ranking", "build:ranking"]
  variables:
    SVC: ranking
    ENV: staging
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - changes: ["services/ranking/**/*", "ci/templates/**/*", "ci/contracts/**/*"]
