# ranking — placeholder fragment (test → build → deliver → deploy-staging stub; NOT fully-wired).
# Change detection: every job is guarded by `rules: changes:` on this service's path so editing
# another service never runs these jobs (independent deployability).
#
# Cross-service contract: build also needs the async GameCompleted contract check (ranking is a
# consumer), so an incompatible event-schema change blocks this build (fail-fast, consigna §6.3).

"test:ranking":
  stage: test
  image: python:3.12-slim
  script:
    - cd services/ranking
    - pip install ruff mypy pytest
    - ruff check .
    - mypy .
    - pytest
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - changes: ["services/ranking/**/*", "ci/templates/**/*", "ci/contracts/**/*"]

"build:ranking":
  extends: .build-image
  # optional: the contract check only enters the pipeline when the schema or one of the paired
  # services changes. Editing a shared CI template pulls this build in without it, and a `needs`
  # on an absent job is a pipeline config error. When the check IS present it still gates.
  needs:
    - "test:ranking"
    - job: "test:contract:game-completed"
      optional: true
  variables:
    SVC: ranking
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - changes: ["services/ranking/**/*", "ci/templates/**/*", "ci/contracts/**/*"]

"deliver:ranking":
  stage: deliver
  image:
    name: alpine/helm:3.20.2
    entrypoint: [""]
  needs: ["build:ranking"]
  script:
    - helm lint services/ranking/chart
    - helm package services/ranking/chart -d /tmp
    - 'echo "delivered image $IMAGE_REF + chart"'
    # helm push /tmp/ranking-*.tgz oci://$CI_REGISTRY/<group>/unoarena/charts  (when registry ready)
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - changes: ["services/ranking/**/*", "ci/templates/**/*", "ci/contracts/**/*"]

# Stub: not fully-wired (no integration-staging). Manual on default branch until cluster confirmed.
"deploy-staging:ranking":
  extends: .deploy-gitops
  stage: deploy-staging
  needs: ["deliver:ranking"]
  variables:
    SVC: ranking
    ENV: staging
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes: ["services/ranking/**/*"]
      when: manual
      allow_failure: true
