# Environment overlay for analytics-workers (staging). image.digest is pinned by the deploy-gitops CI
# job at deploy time — build once, promote the SAME digest from staging to production (no rebuild).
image:
  repository: registry.gitlab.com/itba-73-40-microservicios/alumnos/2026-s1/grupo-4/amicro-tp/unoarena/analytics-workers
  digest: "sha256:96de9ad9cce36febc30d9bbfb29714eda2b6f3eb2fbcf8805364a162d970dc2f" # pinned by CI (deploy-gitops)
imagePullSecrets:
  - name: gitlab-registry
replicas: 1
logLevel: debug
serviceMonitor:
  enabled: true
secretName: analytics-secrets # SealedSecret delivered by the secrets-staging app (gitops/secrets/)
# The write side of the analytics CQRS split: it owns the schema `analytics-api` reads. Its own
# database and role since P6; the password arrives through secretName above.
env:
  - name: DATABASE_HOST
    value: unoarena-pg-rw.postgres.svc.cluster.local
  - name: DATABASE_NAME
    value: analytics
  - name: DATABASE_USER
    value: analytics
  - name: KAFKA_BROKERS
    value: unoarena-kafka-bootstrap.kafka.svc.cluster.local:9092
