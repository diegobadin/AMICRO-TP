# Environment overlay for room-gameplay (staging). image.digest is pinned by the deploy-gitops CI job at
# deploy time — build once, promote the SAME digest from staging to production (no rebuild).
image:
  repository: registry.gitlab.com/itba-73-40-microservicios/alumnos/2026-s1/grupo-4/amicro-tp/unoarena/room-gameplay
  digest: "sha256:359959f0e00b39e3b0db1ca03b5c106cd50226fa78c77f6d671988ddda24e45e" # pinned by CI (deploy-gitops)
imagePullSecrets:
  - name: gitlab-registry
replicas: 1
logLevel: debug
serviceMonitor:
  enabled: true
secretName: room-gameplay-secrets # SealedSecret delivered by the secrets-staging app (gitops/secrets/)
# Connection parts are plain config; the database password arrives through secretName above. The
# JWT signing key left with P4 — the gateway validates, this service trusts its headers. The role and the database are room-gameplay's own
# (gitops/platform/postgres/). ROOM_MIN_PLAYERS and TURN_TIMEOUT_SECONDS are levers a drill or the
# exam demo can turn without a rebuild (plan D11).
env:
  - name: DATABASE_HOST
    value: unoarena-pg-rw.postgres.svc.cluster.local
  - name: DATABASE_NAME
    value: room_gameplay
  - name: DATABASE_USER
    value: room_gameplay
  - name: KAFKA_BROKERS
    value: unoarena-kafka-bootstrap.kafka.svc.cluster.local:9092
  # Where committed events go for the gateway to fan out as SSE (P4, decision E1). A transient
  # copy: losing it costs the live feed, never the game.
  - name: REDIS_URL
    value: redis://redis.redis.svc.cluster.local:6379
  - name: ROOM_MIN_PLAYERS
    value: "2"
  - name: TURN_TIMEOUT_SECONDS
    value: "30"
  # P5's two levers, written out at their defaults rather than left implicit: they change what a
  # demo looks like, and a value you cannot see in the overlay is one nobody knows they can turn.
  # Lowering the expiry mid-flight is safe; raising it leaves already-cached deadlines early, which
  # costs a few wasted ticks until the longer window passes (see ESTADO-FINAL).
  - name: IDLE_TIMEOUTS_BEFORE_FORFEIT
    value: "3"
  - name: WAITING_ROOM_EXPIRY_SECONDS
    value: "900"
# No NodePort since P4. It trusts `X-Player-Id` from the gateway and validates nothing itself, so
# being unreachable from outside the cluster is part of the security argument, not an inconvenience.
service:
  type: ClusterIP
