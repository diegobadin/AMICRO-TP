# EXAMPLE Sealed Secret for identity (staging). The encryptedData below is a PLACEHOLDER, not a
# real secret — regenerate it against your cluster's sealed-secrets controller. The plaintext never
# enters the repo; only the controller can decrypt the sealed blob (consigna §6.5 — no plaintext).
#
# Regenerate:
#   echo -n 'my-real-token-secret' | kubectl create secret generic identity-secrets \
#     --dry-run=client --from-file=IDENTITY_TOKEN_SECRET=/dev/stdin -o yaml -n unoarena-staging \
#     | kubeseal --format yaml > sealed-secret.yaml
#
# Then reference it from the chart by mounting identity-secrets as env (envFrom.secretRef).
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: identity-secrets
  namespace: unoarena-staging
spec:
  encryptedData:
    IDENTITY_TOKEN_SECRET: AgBPLACEHOLDER_ENCRYPTED_VALUE_REGENERATE_WITH_KUBESEAL==
  template:
    metadata:
      name: identity-secrets
      namespace: unoarena-staging
    type: Opaque
