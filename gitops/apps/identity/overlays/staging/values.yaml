# Environment overlay for identity (staging). image.digest is pinned by the deploy-gitops CI job at
# deploy time — build once, promote the SAME digest from staging to production (no rebuild).
image:
  repository: registry.gitlab.com/itba-73-40-microservicios/alumnos/2026-s1/grupo-4/amicro-tp/unoarena/identity
  digest: "sha256:7e7a19e6a14b99b3e19cfd6d6e57d3f87841471d3776bd924046661d5d46c143" # pinned by CI (deploy-gitops)
imagePullSecrets:
  - name: gitlab-registry
replicas: 1
logLevel: debug
secretName: identity-secrets # SealedSecret delivered by the secrets-staging app (gitops/secrets/)
# The connection parts are plain config; only the password is a secret, and it arrives through
# secretName above. The role and the database are identity's own (gitops/platform/postgres/).
env:
  - name: DATABASE_HOST
    value: unoarena-pg-rw.postgres.svc.cluster.local
  - name: DATABASE_NAME
    value: identity
  - name: DATABASE_USER
    value: identity
  - name: REDIS_URL
    value: redis://redis.redis.svc.cluster.local:6379
  - name: KAFKA_BROKERS
    value: unoarena-kafka-bootstrap.kafka.svc.cluster.local:9092
service:
  type: NodePort
  nodePort: 30080 # matches gitops/bootstrap/kind-cluster.yaml extraPortMapping → staging URL host:30080
