# Environment overlay for outbox-relay (staging). image.digest is pinned by the deploy-gitops CI job at
# deploy time — build once, promote the SAME digest from staging to production (no rebuild).
image:
  repository: registry.gitlab.com/itba-73-40-microservicios/alumnos/2026-s1/grupo-4/amicro-tp/unoarena/outbox-relay
  digest: "sha256:9eb3898245b10c50047e62aa82670d74f8b4d9dfd183f0857e7858c86a3ed402" # pinned by CI (deploy-gitops)
imagePullSecrets:
  - name: gitlab-registry
replicas: 1
logLevel: debug
serviceMonitor:
  enabled: true
secretName: room-gameplay-secrets # the same role that owns the outbox it drains
# It reads room-gameplay's outbox and writes to the topics declared in gitops/platform/kafka/. The
# row names its own topic, so this service needs no list of event types and P6's consumers need
# nothing added here.
env:
  - name: DATABASE_HOST
    value: unoarena-pg-rw.postgres.svc.cluster.local
  - name: DATABASE_NAME
    value: room_gameplay
  - name: DATABASE_USER
    value: room_gameplay
  - name: KAFKA_BROKERS
    value: unoarena-kafka-bootstrap.kafka.svc.cluster.local:9092
  - name: POLL_INTERVAL_MS
    value: "1000"

# P7's second producer, drained by the same binary from a second Deployment. Everything that differs
# between the two outboxes is here: whose database, whose column, whose `ce-source`. The defaults in
# the image are still room-gameplay's, so the Deployment above needs none of this.
instances:
  - name: tournament
    secretName: tournament-secrets # holds TOURNAMENT_DB_PASSWORD, sealed for this namespace
    env:
      - name: DATABASE_HOST
        value: unoarena-pg-rw.postgres.svc.cluster.local
      - name: DATABASE_NAME
        value: tournament
      - name: DATABASE_USER
        value: tournament
      # The generic name the relay reads first; the secret delivers it under its own.
      - name: DATABASE_PASSWORD
        valueFrom:
          secretKeyRef:
            name: tournament-secrets
            key: TOURNAMENT_DB_PASSWORD
      - name: KAFKA_BROKERS
        value: unoarena-kafka-bootstrap.kafka.svc.cluster.local:9092
      - name: POLL_INTERVAL_MS
        value: "1000"
      - name: EVENT_SOURCE
        value: /tournament
      - name: CE_TYPE_PREFIX
        value: com.unoarena.tournament.
      - name: OUTBOX_KEY_COLUMN
        value: tournament_id
      - name: BODY_ID_FIELD
        value: tournamentId
