# Environment overlay for spectator (staging). image.digest is pinned by the deploy-gitops CI job at
# deploy time — build once, promote the SAME digest from staging to production (no rebuild).
image:
  repository: registry.gitlab.com/itba-73-40-microservicios/alumnos/2026-s1/grupo-4/amicro-tp/unoarena/spectator
  digest: "sha256:baa616140ecfd61bdf08236b9e498a20ff4c392c9b51780961e4af08b6626c65" # pinned by CI (deploy-gitops)
imagePullSecrets:
  - name: gitlab-registry
replicas: 1
logLevel: debug
serviceMonitor:
  enabled: true
# No secretName: this service holds no credential. Its input is Kafka and its store is Redis, and on
# this platform neither asks for one — persistence-layer §5 makes the whole context a Redis read
# model, so there is not even a database password to seal.
env:
  - name: KAFKA_BROKERS
    value: unoarena-kafka-bootstrap.kafka.svc.cluster.local:9092
  # The same Redis the gateway and room-gameplay use, under its own `spectator:*` keyspace
  # (persistence-layer §7). Losing it costs the projection, which Kafka can rebuild.
  - name: REDIS_URL
    value: redis://redis.redis.svc.cluster.local:6379
