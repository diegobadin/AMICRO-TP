{{- $root := . }}
{{- range $env := .Values.environments }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: secrets-{{ $env }}
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  # Ahead of the services: a pod whose envFrom secret does not exist yet sits in
  # CreateContainerConfigError until the kubelet retries. It self-heals either way, but a fresh
  # cluster should not spend its first minutes looking broken.
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: unoarena
  destination:
    server: https://kubernetes.default.svc
    namespace: unoarena-{{ $env }}
  source:
    repoURL: {{ $root.Values.repoURL }}
    targetRevision: {{ $root.Values.targetRevision }}
    path: gitops/secrets/{{ $env }}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
{{- end }}
