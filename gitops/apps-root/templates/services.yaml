{{- $root := . }}
{{- range $env := .Values.environments }}
{{- range $svc := $root.Values.services }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ $svc }}-{{ $env }}
  namespace: argocd
  # Removing a service (or an environment) from values.yaml must remove it from the cluster too:
  # the root prunes this Application, and the finalizer cascades that deletion to its resources
  # instead of orphaning them.
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: unoarena
  destination:
    server: https://kubernetes.default.svc
    namespace: unoarena-{{ $env }}
  # Two sources: the chart, and the same repo again as a `ref` so the environment overlay can be
  # referenced as $values/... without vendoring it into the chart.
  sources:
    - repoURL: {{ $root.Values.repoURL }}
      targetRevision: {{ $root.Values.targetRevision }}
      path: services/{{ $svc }}/chart
      helm:
        valueFiles:
          - $values/gitops/apps/{{ $svc }}/overlays/{{ $env }}/values.yaml
    - repoURL: {{ $root.Values.repoURL }}
      targetRevision: {{ $root.Values.targetRevision }}
      ref: values
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # A service ships its own ServiceMonitor, whose CRD arrives with kube-prometheus-stack in a
      # different app. On a cluster created minutes ago that is a race, and Argo gives up after
      # five attempts — leaving the service permanently down with nothing but a stale SyncError to
      # show for it. Same convergence posture the platform apps got in P1: skip the dry run for a
      # kind the cluster does not know yet, and retry long enough for the operator to land.
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 10
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
{{- end }}
{{- end }}
