apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: unoarena
  namespace: argocd
spec:
  description: UnoArena placeholder services (DevOps checkpoint)
  sourceRepos:
    - "*"
  destinations:
    # argocd: the unoarena-root app-of-apps itself lives there (its "resources" are the
    # per-service Application objects) — without it the root is InvalidSpecError on any
    # fresh cluster.
    - namespace: argocd
      server: https://kubernetes.default.svc
    - namespace: "unoarena-*"
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
