# App-of-apps for the services: renders one Argo Application per service per environment from
# gitops/apps-root. The chart passes targetRevision down to every child, so a drill cluster can
# track a feature branch end to end — install.sh rewrites both revisions below via TARGET_REVISION
# (default main).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: unoarena-root
  namespace: argocd
spec:
  project: unoarena
  source:
    repoURL: https://gitlab.com/itba-73-40-microservicios/alumnos/2026-s1/grupo-4/amicro-tp.git
    targetRevision: main
    path: gitops/apps-root
    helm:
      parameters:
        - name: targetRevision
          value: main
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
