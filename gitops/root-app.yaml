# App-of-apps: registers every per-service Application under gitops/applications.
# Replace https://gitlab.com/itba-73-40-microservicios/alumnos/2026-s1/grupo-4/amicro-tp.git with the GitLab repo URL once the project is created.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: unoarena-root
  namespace: argocd
spec:
  project: unoarena
  source:
    repoURL: https://gitlab.com/itba-73-40-microservicios/alumnos/2026-s1/grupo-4/amicro-tp.git
    targetRevision: main
    path: gitops/applications
    directory:
      recurse: false
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
