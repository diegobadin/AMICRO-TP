apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: analytics-workers-production
  namespace: argocd
spec:
  project: unoarena
  destination:
    server: https://kubernetes.default.svc
    namespace: unoarena-production
  sources:
    - repoURL: REPLACE_REPO_URL
      targetRevision: main
      path: services/analytics-workers/chart
      helm:
        valueFiles:
          - $values/gitops/apps/analytics-workers/overlays/production/values.yaml
    - repoURL: REPLACE_REPO_URL
      targetRevision: main
      ref: values
  syncPolicy:
  # production: manual sync (no automated block) — promote via gate
    syncOptions:
      - CreateNamespace=true
