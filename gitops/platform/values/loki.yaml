# Loki in SingleBinary mode: one pod, filesystem storage, no PVC. The whole point here is a place to
# follow one correlationId across ten services during a demo — not a log archive. Everything the
# chart offers for scale is off, and each of those defaults is expensive enough to matter on a kind
# node (the caches alone ask for gigabytes of memcached).
#
# Ephemeral on purpose, like Prometheus and Alertmanager beside it: logs surviving a pod restart is
# not a demo requirement, and a PVC on EKS is a volume that outlives `eksctl delete` and keeps
# billing (gitops/bootstrap/eks/README.md).
deploymentMode: SingleBinary

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h
  limits_config:
    retention_period: 24h
    # The demo replays events; a client that reconnects can legitimately resend an identical line.
    reject_old_samples: false

singleBinary:
  replicas: 1
  persistence:
    enabled: false
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi

# The scale-out deployment shapes, all off — SingleBinary replaces them.
read:
  replicas: 0
write:
  replicas: 0
backend:
  replicas: 0

# nginx in front of Loki. Alloy writes to the single binary's Service directly and Grafana reads it
# the same way, so this would be a hop that exists to be configured.
gateway:
  enabled: false

# memcached. Defaults are sized for a real cluster and would not schedule next to everything else.
chunksCache:
  enabled: false
resultsCache:
  enabled: false

# A DaemonSet that writes synthetic log lines to measure Loki's own latency, and a helm test pod
# that checks the canary. Neither earns its keep in a demo.
lokiCanary:
  enabled: false
test:
  enabled: false
