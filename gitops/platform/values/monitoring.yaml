# kube-prometheus-stack trimmed for the placeholder era (D4): no Alertmanager (no alerting
# requirement yet), Grafana reached by port-forward until an ingress exists (P4), business
# dashboards arrive with P8. Everything ephemeral (default emptyDir storage) and sized for
# kind (R1).
# P8 (E3) turns this back on: "infraestructura de observabilidad" reads thin if nothing in the
# system can alert. What ships is the alerting plane and the rules — the chart's default route with
# its null receiver, and **no notification config at all**. An alert that pages a channel nobody
# reads is theatre; these are meant to be seen firing, in Prometheus and on the async-spine board.
# Storage stays ephemeral like everything else here.
alertmanager:
  enabled: true
  alertmanagerSpec:
    resources:
      requests:
        cpu: 20m
        memory: 64Mi
      limits:
        memory: 128Mi
# Control-plane scrape targets: off. Their Services land in kube-system (outside the platform
# AppProject), EKS's managed control plane never exposes them, and kind binds them to localhost
# — permanently-down targets either way. kubelet stays on (operator-managed, works on both).
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeEtcd:
  enabled: false
kubeProxy:
  enabled: false
coreDns:
  enabled: false
prometheus:
  prometheusSpec:
    retention: 24h
    # Scrape every ServiceMonitor in the cluster, not only the ones labelled with this chart's
    # release. Services ship their own ServiceMonitor from their first real phase and should not
    # have to know the name of the monitoring release to be discovered.
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    # Same rule for alert rules (P8): a PrometheusRule is selected because it is a rule, not because
    # it carries this release's name. Without this the operator silently ignores gitops/platform/
    # alert-rules and Prometheus shows no rules at all — with nothing anywhere reporting an error.
    ruleSelectorNilUsesHelmValues: false
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        memory: 768Mi
prometheusOperator:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi
grafana:
  # P8: the credential is ours now, sealed into `grafana-admin` by gitops/secrets/seal.sh and
  # delivered by the monitoring-secrets app at wave -1. It replaces the password the chart generates
  # for itself, which nobody owns and which could only be recovered by reading a Secret — tolerable
  # while the only way in was a port-forward, not once Grafana answers on a node port. The key names
  # are the chart's own defaults; renaming them falls back to the generated secret without erroring.
  admin:
    existingSecret: grafana-admin
  # 30081 is published by the kind node and has been free since P4 collapsed the two NodePorts into
  # the gateway. One fixed URL that behaves the same on kind and on EKS, and one less live command
  # during the demo. Still no ingress and no TLS: same posture as the gateway on a private cluster.
  service:
    type: NodePort
    nodePort: 30081
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi
kube-state-metrics:
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      memory: 128Mi
