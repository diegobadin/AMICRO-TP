# One CNPG cluster for the whole system (D2): per-context persistence is logical (databases),
# not physical (instances) — separate instances would triple the RAM bill for placeholder-era
# value. Single instance on kind (R1); the exam shape can raise `instances` later.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: unoarena-pg
  namespace: postgres
spec:
  instances: 1
  # Per-service login roles: each real service owns its database with its own credentials, so a
  # compromised service cannot read another context's data. The password arrives as a SealedSecret
  # (basic-auth type, which is what CNPG expects) — see gitops/secrets/README.md.
  managed:
    roles:
      - name: identity
        ensure: present
        login: true
        passwordSecret:
          name: identity-db-role
  storage:
    size: 2Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi
