# One database per Postgres-backed bounded context (docs/architecture/03-persistence-layer.md
# §1-§6; Spectator is Redis-only). A context's database is owned by its own login role once the
# real service exists (identity P2, room-gameplay P3); the rest stay on the bootstrap `app` role
# until their phase.
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: identity
  namespace: postgres
spec:
  name: identity
  owner: identity
  cluster:
    name: unoarena-pg
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: room-gameplay
  namespace: postgres
spec:
  name: room_gameplay
  owner: room_gameplay
  cluster:
    name: unoarena-pg
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: tournament
  namespace: postgres
spec:
  name: tournament
  owner: app
  cluster:
    name: unoarena-pg
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: ranking
  namespace: postgres
spec:
  name: ranking
  owner: app
  cluster:
    name: unoarena-pg
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: analytics
  namespace: postgres
spec:
  name: analytics
  owner: app
  cluster:
    name: unoarena-pg
