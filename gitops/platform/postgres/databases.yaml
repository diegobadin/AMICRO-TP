# One database per Postgres-backed bounded context (docs/architecture/03-persistence-layer.md
# §1-§6; Spectator is Redis-only, and stays that way — its whole context is a Redis read model).
# A context's database is owned by its own login role once the real service exists (identity P2,
# room-gameplay P3, ranking + analytics P6, tournament P7) — since P7 every database declared here
# has one. CNPG's own bootstrap `app` database is not one of them and stays where it is.
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: identity
  namespace: postgres
spec:
  name: identity
  owner: identity
  cluster:
    name: unoarena-pg
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: room-gameplay
  namespace: postgres
spec:
  name: room_gameplay
  owner: room_gameplay
  cluster:
    name: unoarena-pg
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: tournament
  namespace: postgres
spec:
  name: tournament
  owner: tournament
  cluster:
    name: unoarena-pg
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: ranking
  namespace: postgres
spec:
  name: ranking
  owner: ranking
  cluster:
    name: unoarena-pg
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: analytics
  namespace: postgres
spec:
  name: analytics
  owner: analytics
  cluster:
    name: unoarena-pg
