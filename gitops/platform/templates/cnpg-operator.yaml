# Wave 0: operators before instances (D5). ServerSideApply for the same reason as Strimzi —
# the chart ships ~1.2MB of CRDs, far past the client-side apply annotation limit.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cnpg-operator
  namespace: argocd
  # Removing a component from git must remove it from the cluster too: the root prunes this
  # Application, and the finalizer cascades that deletion to its resources instead of
  # orphaning them.
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: unoarena-platform
  source:
    repoURL: https://cloudnative-pg.github.io/charts
    chart: cloudnative-pg
    targetRevision: 0.29.0
    helm:
      values: |
{{ .Files.Get "values/cnpg-operator.yaml" | indent 8 }}
  destination:
    server: https://kubernetes.default.svc
    namespace: cnpg-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 10
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
