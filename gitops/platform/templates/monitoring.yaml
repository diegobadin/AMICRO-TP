# Wave 0: operator and instance ship in one chart here; its own CRDs land in the same sync, so
# the CR dry-run skip + retry cover the in-app race. ServerSideApply: the prometheus CRDs are
# the largest of the whole platform (>1MB).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
  # Removing a component from git must remove it from the cluster too: the root prunes this
  # Application, and the finalizer cascades that deletion to its resources instead of
  # orphaning them.
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: unoarena-platform
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 87.19.2
    helm:
      values: |
{{ .Files.Get "values/monitoring.yaml" | indent 8 }}
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 10
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
