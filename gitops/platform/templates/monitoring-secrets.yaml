# Wave -1: ahead of monitoring itself. Grafana reads its admin credential through `envFrom`-style
# secretKeyRefs, which the kubelet resolves when the pod is created — a Secret that arrives later
# leaves the pod in CreateContainerConfigError until it retries. It self-heals either way, but a
# fresh cluster should not spend its first minutes looking broken. (The same reasoning as the
# services' secrets-<env> app, and the same trap that cost P7 a silently 401ing timer worker: a
# Deployment does not restart when a Secret it already resolved changes underneath it.)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring-secrets
  namespace: argocd
  # Removing a component from git must remove it from the cluster too: the root prunes this
  # Application, and the finalizer cascades that deletion to its resources instead of
  # orphaning them.
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: unoarena-platform
  source:
    repoURL: {{ .Values.repoURL }}
    targetRevision: {{ .Values.targetRevision }}
    path: gitops/platform/monitoring-secrets
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 10
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
