# Single-node KRaft Kafka (D1): one combined controller+broker, sized for kind (R1).
# The Topic Operator arrives with the first real producer (P2, identity): a topic the event
# catalog names should be declared in git with its partitions and retention, not conjured by
# broker auto-creation. deleteClaim keeps EKS rehearsals EBS-clean (E2).
apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: single
  namespace: kafka
  labels:
    strimzi.io/cluster: unoarena
spec:
  replicas: 1
  roles:
    - controller
    - broker
  storage:
    type: persistent-claim
    size: 5Gi
    deleteClaim: true
  resources:
    requests:
      cpu: 250m
      memory: 768Mi
    limits:
      memory: 1Gi
  jvmOptions:
    "-Xms": 512m
    "-Xmx": 512m
---
apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  name: unoarena
  namespace: kafka
spec:
  kafka:
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
    config:
      offsets.topic.replication.factor: 1
      transaction.state.log.replication.factor: 1
      transaction.state.log.min.isr: 1
      default.replication.factor: 1
      min.insync.replicas: 1
  entityOperator:
    topicOperator:
      resources:
        requests:
          cpu: 50m
          memory: 192Mi
        limits:
          memory: 256Mi
