# Topics from the event catalog (docs/architecture/10-api-event-catalog.md), declared as the
# services that produce them become real. Partition counts are the kind-sized values, not the
# catalog's production sizing (64 partitions on a single broker buys nothing) — that is a values
# change, not a design change.
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: identity.session-events
  namespace: kafka
  labels:
    strimzi.io/cluster: unoarena
spec:
  topicName: identity.session-events
  partitions: 3
  replicas: 1
  config:
    retention.ms: 259200000 # 3 days, per persistence-layer §7.2
---
# room-gameplay fills its outbox from P3 on, but nothing drains it until P5's relay. Declaring the
# destinations now keeps the catalog in git and means the relay is the only thing P5 has to add.
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: room.public.events
  namespace: kafka
  labels:
    strimzi.io/cluster: unoarena
spec:
  topicName: room.public.events
  partitions: 3
  replicas: 1
  config:
    retention.ms: 259200000
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: room.lifecycle.events
  namespace: kafka
  labels:
    strimzi.io/cluster: unoarena
spec:
  topicName: room.lifecycle.events
  partitions: 3
  replicas: 1
  config:
    retention.ms: 604800000 # 7 days: Ranking and Tournament replay these, Spectator does not
