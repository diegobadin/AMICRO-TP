# Minimal local kind cluster used as the staging cluster (no cloud; consigna §4 — the cluster is
# assumed to exist, and a kind/k3d/minikube equivalent is explicitly allowed). Argo CD runs here
# and the pipeline produces a green integration-staging run against it.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080 # the gateway — the single entry point (UNOARENA_API_URL)
        hostPort: 30080
      # Grafana since P8. It was room-gameplay's until P4 collapsed the two entry points into one,
      # then sat mapped and unused — which is exactly why it was worth keeping: port mappings are
      # fixed when the cluster is created, so an unused mapping is the only thing that lets a later
      # phase expose something without recreating every existing cluster.
      - containerPort: 30081 # Grafana — the observability entry point
        hostPort: 30081
