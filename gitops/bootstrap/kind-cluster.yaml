# Minimal local kind cluster used as the staging cluster (no cloud; consigna §4 — the cluster is
# assumed to exist, and a kind/k3d/minikube equivalent is explicitly allowed). Argo CD runs here
# and the pipeline produces a green integration-staging run against it.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080 # ingress/nodeport for the identity staging URL
        hostPort: 30080
