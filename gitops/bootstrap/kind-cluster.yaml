# Minimal local kind cluster used as the staging cluster (no cloud; consigna §4 — the cluster is
# assumed to exist, and a kind/k3d/minikube equivalent is explicitly allowed). Argo CD runs here
# and the pipeline produces a green integration-staging run against it.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080 # the gateway — the single entry point (UNOARENA_API_URL)
        hostPort: 30080
      # Kept mapped and unused since P4 collapsed the two entry points into one. Port mappings are
      # fixed when the cluster is created, so leaving it here is what lets an existing cluster pick
      # up P4 without being recreated — and what leaves room for a second port if one is ever needed.
      - containerPort: 30081
        hostPort: 30081
