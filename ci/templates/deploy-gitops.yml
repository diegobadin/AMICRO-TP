# Reusable GitOps deploy — the pipeline does NOT kubectl apply. It pins the delivered image
# digest into the env overlay and asks Argo CD to reconcile, then WAITS for Argo health before
# the job goes green (honest readiness gate — not `sleep 30`, consigna §6.5).
#
# A service fragment uses this by setting SVC + ENV and `extends: .deploy-gitops`.
# Requires GITOPS_PUSH_TOKEN. ARGOCD_SERVER / ARGOCD_AUTH_TOKEN are optional: the digest pin is
# what makes a from-empty cluster deployable, so it runs unconditionally, and the push-based
# reconcile only happens when a persistent cluster is actually wired up. Drill clusters pull the
# pin themselves on their own sync schedule.

.deploy-gitops:
  image: alpine:3.20
  variables:
    OVERLAY: "gitops/apps/$SVC/overlays/$ENV/values.yaml"
  script:
    - apk add --no-cache git curl yq
    # 1) Pin the delivered image (repository + digest) into the env overlay. Pinning the repository
    #    too means Argo always deploys exactly what CI built ($CI_REGISTRY_IMAGE/$SVC), regardless of
    #    the chart's placeholder default. Promotion = digest, no rebuild. The pin lands on the
    #    CURRENT remote head (not this pipeline's checkout) so the push fast-forwards even if the
    #    branch moved on since this pipeline ran.
    - git config user.email "ci@unoarena"; git config user.name "unoarena-ci-bot"
    - git fetch "https://oauth2:${GITOPS_PUSH_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git" "$CI_COMMIT_REF_NAME"
    - git checkout -B ci-deploy FETCH_HEAD
    - yq -i ".image.repository = \"$IMAGE\" | .image.digest = \"$IMAGE_DIGEST\"" "$OVERLAY"
    - git add "$OVERLAY"
    - 'git commit -m "deploy($SVC): pin $ENV to $IMAGE_DIGEST [skip ci]" || echo "no change"'
    - git push "https://oauth2:${GITOPS_PUSH_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git" "HEAD:${CI_COMMIT_REF_NAME}"
    # 2) Reconcile and WAIT for Argo to report Synced+Healthy (the readiness gate). Only when a
    #    persistent cluster is wired: without one the pin above is the whole deploy, and Argo picks
    #    it up whenever the cluster next syncs.
    - |
      if [ -z "${ARGOCD_SERVER:-}" ]; then
        echo "no ARGOCD_SERVER configured — digest pinned in git, no cluster to reconcile"
        exit 0
      fi
    - curl -sSL -o /usr/local/bin/argocd https://github.com/argoproj/argo-cd/releases/download/v2.12.3/argocd-linux-amd64
    - chmod +x /usr/local/bin/argocd
    - argocd login "$ARGOCD_SERVER" --auth-token "$ARGOCD_AUTH_TOKEN" --grpc-web
    - argocd app sync "$SVC-$ENV" --grpc-web
    - argocd app wait "$SVC-$ENV" --health --sync --timeout 180 --grpc-web
  environment:
    name: "$ENV/$SVC"

# Production split (consigna §6.7): promotion and rollout are separate manual gates.
# .promote-digest is the pin+push half of .deploy-gitops — it copies the digest the pipeline
# already tested into the target overlay (build once, never a rebuild). .argocd-sync is the
# reconcile half, with the same honest wait-for-health gate.

.promote-digest:
  image: alpine:3.20
  variables:
    OVERLAY: "gitops/apps/$SVC/overlays/$ENV/values.yaml"
  script:
    - apk add --no-cache git yq
    - git config user.email "ci@unoarena"; git config user.name "unoarena-ci-bot"
    - git fetch "https://oauth2:${GITOPS_PUSH_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git" "$CI_COMMIT_REF_NAME"
    - git checkout -B ci-promote FETCH_HEAD
    - yq -i ".image.repository = \"$IMAGE\" | .image.digest = \"$IMAGE_DIGEST\"" "$OVERLAY"
    - git add "$OVERLAY"
    - 'git commit -m "promote($SVC): pin $ENV to $IMAGE_DIGEST [skip ci]" || echo "no change"'
    - git push "https://oauth2:${GITOPS_PUSH_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git" "HEAD:${CI_COMMIT_REF_NAME}"
  environment:
    name: "$ENV/$SVC"

.argocd-sync:
  image: alpine:3.20
  script:
    - apk add --no-cache curl
    - curl -sSL -o /usr/local/bin/argocd https://github.com/argoproj/argo-cd/releases/download/v2.12.3/argocd-linux-amd64
    - chmod +x /usr/local/bin/argocd
    - argocd login "$ARGOCD_SERVER" --auth-token "$ARGOCD_AUTH_TOKEN" --grpc-web
    - argocd app sync "$SVC-$ENV" --grpc-web
    - argocd app wait "$SVC-$ENV" --health --sync --timeout 180 --grpc-web
  environment:
    name: "$ENV/$SVC"
