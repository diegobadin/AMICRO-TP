# Reusable CLI-driven smoke test for the fully-wired service. Drives the deployed placeholder
# through the Client CLI (NOT raw curl) so the integration harness matches what the faculty runs
# to exercise the cluster (consigna §6.6 + Client-Checkpoint.md). Asserts on the CLI --json output.
#
# A fragment uses this by setting SVC + UNOARENA_API_URL (injected, never hardcoded localhost)
# and `extends: .smoke-cli`. Hermetic: the account is namespaced per pipeline so reruns don't
# collide. Fails the pipeline on unreachable / wrong canned response. Flake budget: retry 1.

.smoke-cli:
  stage: integration-staging
  image: node:20-alpine
  retry: 1
  variables:
    SMOKE_USER: "smoke-$CI_PIPELINE_ID"
    SMOKE_PASS: "smoke-pass-$CI_PIPELINE_ID"
  script:
    - cd clients/cli && npm install --no-audit --no-fund && npm run build && cd "$CI_PROJECT_DIR"
    - export UNOARENA_API_URL UNOARENA_SESSION=/tmp/uno-session.json
    - node clients/cli/dist/cli.js register --user "$SMOKE_USER" --pass "$SMOKE_PASS" --json | tee /tmp/reg.json
    - node clients/cli/dist/cli.js whoami --json | tee /tmp/whoami.json
    # Assert: register ok AND whoami returns the user we just registered
    - node clients/cli/scripts/assert-smoke.js /tmp/reg.json /tmp/whoami.json "$SMOKE_USER"
  environment:
    name: "staging/$SVC"
    url: "$UNOARENA_API_URL"
