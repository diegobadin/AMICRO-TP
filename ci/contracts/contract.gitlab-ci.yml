# Async contract-check seam. Runs in the `test` stage on the GameCompleted pair (producer:
# room-gameplay, published by outbox-relay; consumers: ranking, analytics-workers, spectator —
# spectator joined in P6, when it started reading the lifecycle topic too). Its failure is a
# `needs:` blocker for the consumers' build jobs, so an incompatible event-schema change blocks ALL
# affected services (cross-service fail-fast, consigna §6.3). One check on one pair is enough.
#
# Since P5 the sample it validates is generated by the producer's own suite rather than written by
# hand, so the check can go red on a real producer change — which is what a contract seam is for.

"test:contract:game-completed":
  stage: test
  image: python:3.12-alpine
  script:
    - pip install --quiet jsonschema
    - python ci/contracts/validate.py
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - changes:
        - ci/contracts/**/*
        - services/room-gameplay/**/*
        - services/outbox-relay/**/* # it builds the envelope the consumers read
        - services/ranking/**/*
        - services/analytics-workers/**/*
        - services/spectator/**/*
