# Async contract-check seam. Runs in the `test` stage over every producer/consumer pair the system
# has: GameCompleted (room-gameplay → ranking, analytics-workers, spectator), and since P7
# MatchCompleted (room-gameplay → tournament) and TournamentCompleted (tournament → ranking,
# analytics-workers). Its failure is a `needs:` blocker for the consumers' build jobs, so an
# incompatible event-schema change blocks ALL affected services (cross-service fail-fast,
# consigna §6.3).
#
# Since P5 the samples it validates are generated by each producer's own suite rather than written
# by hand, so the check can go red on a real producer change — which is what a contract seam is for.
# MatchCompleted is the one that matters most: the tournament advances rounds on `advancingPlayers`,
# so dropping it would stall every bracket rather than degrade a number.
#
# The job keeps its name: it is referenced by an `optional: true` needs in several build jobs, and
# renaming it would silently stop gating them.

"test:contract:game-completed":
  stage: test
  image: python:3.12-alpine
  script:
    - pip install --quiet jsonschema
    - python ci/contracts/validate.py
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - changes:
        - ci/contracts/**/*
        - services/room-gameplay/**/*
        - services/outbox-relay/**/* # it builds the envelope the consumers read
        - services/ranking/**/*
        - services/analytics-workers/**/*
        - services/spectator/**/*
        - services/tournament/**/* # producer of TournamentCompleted, consumer of MatchCompleted
